
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Camp - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #075985;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .summary, .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            margin-bottom: 22px;
        }

        .summary h2 {
            margin-top: 0;
        }

        #total {
            font-size: 32px;
            color: #0284c7;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e0f2fe;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        #message {
            margin: 15px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0369a1;
        }
    </style>
</head>

<body>
    <header>
        <h1>Medical Camp Admin Dashboard</h1>
        <p>Manage patient registrations</p>
    </header>

    <main>
        <a class="back" href="/">← Back to Home</a>

        <section class="summary">
            <h2>Total Registrations</h2>
            <div id="total">0</div>
            <p>Registered patients</p>
            <button id="refreshButton">Refresh Registrations</button>
        </section>

        <p id="message" role="status">Loading registrations...</p>

        <section class="table-container">
            <h2>Patient Registration Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Camp Date</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody id="registrationList"></tbody>
            </table>
        </section>
    </main>

    <script>
        const total = document.getElementById("total");
        const message = document.getElementById("message");
        const registrationList = document.getElementById("registrationList");
        const refreshButton = document.getElementById("refreshButton");

        async function loadRegistrations() {
            message.textContent = "Loading registrations...";
            registrationList.replaceChildren();

            try {
                const response = await fetch("/api/registrations");

                if (!response.ok) {
                    throw new Error("Could not load registrations.");
                }

                const registrations = await response.json();

                total.textContent = registrations.length;

                if (registrations.length === 0) {
                    message.textContent = "No registrations found yet.";
                    return;
                }

                for (const registration of registrations) {
                    const row = document.createElement("tr");

                    const values = [
                        registration.id,
                        registration.name,
                        registration.age,
                        registration.gender,
                        registration.phone,
                        registration.email,
                        registration.date,
                        registration.address
                    ];

                    for (const value of values) {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    }

                    registrationList.appendChild(row);
                }

                message.textContent = "Registrations loaded successfully.";
            } catch (error) {
                message.textContent =
                    "Unable to load registrations. Please try again.";
                total.textContent = "—";
            }
        }

        refreshButton.addEventListener("click", loadRegistrations);

        loadRegistrations();
    </script>
</body>
</html>
